name: Revisar Canales de Ofertas

on:
  # El disparador nativo de GitHub (schedule) se desactiva -- usamos
  # únicamente el disparador externo (cron-job.org llamando a la API de
  # workflow_dispatch) para evitar que ambos disparen casi al tiempo y las
  # corridas se encimen. Si algún día quitas el externo, puedes reactivar
  # esto quitando el "#" de la línea de abajo.
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch:          # permite ejecutarlo manualmente o vía API externa

concurrency:
  group: revisar-canales
  cancel-in-progress: false

concurrency:
  group: revisar-canales
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar revisión de canales
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python revisar_canales.py

      - name: Guardar estado actualizado
        run: |
          git config user.name "bot-arbitraje"
          git config user.email "bot@arbitraje.local"
          git add data/ultimo_id.json data/pendientes_revision.json data/ultimo_update_id.txt data/estadisticas.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualiza estado"
          git push
